# Example reverse proxy configuration for the MT5 Algo Bot.
#
# Purpose:
#   1. Terminate TLS (HTTPS) in front of the FastAPI app.
#   2. Forward WebSocket upgrade headers for the /ws real-time stream.
#   3. Enforce security headers and sensible request size limits.
#
# Usage:
#   - Replace `example.com` with your real domain.
#   - Point the ssl_certificate paths at your Let's Encrypt / certbot files.
#   - Run the app on 127.0.0.1:8000 (never expose it directly to the internet).
#
# Install on Debian/Ubuntu:  sudo apt install nginx
# Put this file in /etc/nginx/sites-available/bot_trade and symlink it into
# /etc/nginx/sites-enabled/, then `sudo nginx -t && sudo systemctl reload nginx`.

server {
    listen 80;
    server_name example.com;
    # Redirect all plain HTTP traffic to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Limit upload sizes to match the backend 1 MB cap.
    client_max_body_size 1m;

    # WebSocket / upgrade headers.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Security headers (backend mirrors most of these, applied here as defense in depth).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}