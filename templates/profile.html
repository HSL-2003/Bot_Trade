<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile | Confluence Algo Bot</title>
    <style>
        :root { color-scheme: dark; --bg:#070b14; --panel:#101a2b; --border:#243b58; --muted:#91a6c1; --text:#e7f0ff; --accent:#38bdf8; --danger:#fb7185; }
        * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:radial-gradient(circle at top right,#102a49 0,#070b14 45%); color:var(--text); font:15px Inter,Arial,sans-serif; }
        main { width:min(900px,calc(100% - 32px)); margin:0 auto; padding:32px 0 48px; } .top { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:28px; } h1,h2,p { margin:0; } h1 { font-size:28px; } .eyebrow,label { color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
        .nav { display:flex; gap:8px; flex-wrap:wrap; } .button { border:1px solid var(--border); border-radius:8px; padding:10px 14px; color:var(--text); background:#14243a; font:inherit; text-decoration:none; cursor:pointer; } .button.primary { background:var(--accent); border-color:var(--accent); color:#052036; font-weight:800; } .button.danger { color:#fecdd3; }
        .card { background:rgba(16,26,43,.94); border:1px solid var(--border); border-radius:14px; padding:24px; box-shadow:0 20px 50px rgba(0,0,0,.2); } .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; margin-top:20px; } .full { grid-column:1/-1; }
        label { display:block; margin-bottom:7px; } input,select,textarea { width:100%; color:var(--text); background:#091321; border:1px solid var(--border); border-radius:8px; padding:11px 12px; font:inherit; } textarea { resize:vertical; min-height:92px; } input:focus,select:focus,textarea:focus { outline:2px solid rgba(56,189,248,.4); border-color:var(--accent); } .account { margin-top:7px; color:var(--muted); word-break:break-all; } .footer { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:24px; } #message { color:var(--muted); } #message.error { color:var(--danger); } @media(max-width:640px) { main { padding-top:20px; } .top,.footer { align-items:flex-start; flex-direction:column; } .grid { grid-template-columns:1fr; } .full { grid-column:auto; } }
    </style>
</head>
<body>
    <main>
        <header class="top"><div><div class="eyebrow">Account settings</div><h1>Your profile</h1><p class="account" id="account">Checking session…</p></div><nav class="nav"><a class="button" href="/app?view=terminal">Terminal</a><a class="button" href="/dashboard">Dashboard</a><button class="button danger" type="button" id="logout">Log out</button></nav></header>
        <section class="card"><h2>Personal & trading preferences</h2><p class="account">These preferences are stored only for your authenticated account.</p>
            <form id="profileForm"><div class="grid">
                <div><label for="display_name">Display name</label><input id="display_name" maxlength="100" autocomplete="nickname"></div>
                <div><label for="full_name">Full name</label><input id="full_name" maxlength="160" autocomplete="name"></div>
                <div><label for="phone">Phone</label><input id="phone" maxlength="40" autocomplete="tel"></div>
                <div><label for="timezone">Time zone</label><input id="timezone" maxlength="80" placeholder="Asia/Ho_Chi_Minh"></div>
                <div><label for="preferred_currency">Preferred currency</label><select id="preferred_currency"><option value="USD">USD</option><option value="VND">VND</option><option value="EUR">EUR</option></select></div>
                <div><label for="language">Language</label><select id="language"><option value="vi">Tiếng Việt</option><option value="en">English</option></select></div>
                <div><label for="risk_level">Risk level</label><select id="risk_level"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
                <div class="full"><label for="trading_goal">Trading goal</label><textarea id="trading_goal" maxlength="500" placeholder="For example: Preserve capital and target consistent monthly returns."></textarea></div>
            </div><div class="footer"><span id="message" aria-live="polite"></span><button class="button primary" type="submit">Save profile</button></div></form>
        </section>
    </main>
    <script>
        const token = localStorage.getItem('access_token');
        const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
        const fields = ['display_name','full_name','phone','timezone','preferred_currency','language','risk_level','trading_goal'];
        const message = document.getElementById('message');
        const setMessage = (text, error = false) => { message.textContent = text; message.className = error ? 'error' : ''; };
        async function requireSession() { if (!token) throw new Error('Please sign in to continue.'); const response = await fetch('/api/auth/me', { headers }); if (!response.ok) throw new Error('Your session has expired.'); return response.json(); }
        async function loadProfile() { try { const user = await requireSession(); document.getElementById('account').textContent = `Account: ${user.account_id}`; const response = await fetch('/api/profile', { headers }); if (!response.ok) throw new Error('Unable to load your profile.'); const profile = await response.json(); fields.forEach(id => { if (profile[id] != null) document.getElementById(id).value = profile[id]; }); } catch (error) { localStorage.clear(); location.href = '/login'; } }
        document.getElementById('profileForm').addEventListener('submit', async event => { event.preventDefault(); setMessage('Saving…'); const payload = Object.fromEntries(fields.map(id => [id, document.getElementById(id).value.trim()])); try { const response = await fetch('/api/profile', { method:'PATCH', headers, body:JSON.stringify(payload) }); if (response.status === 401) throw new Error('Your session has expired.'); if (!response.ok) throw new Error((await response.json()).detail || 'Unable to save your profile.'); setMessage('Profile saved successfully.'); } catch (error) { setMessage(error.message, true); if (error.message.includes('expired')) { localStorage.clear(); location.href='/login'; } } });
        document.getElementById('logout').addEventListener('click', async () => { try { await fetch('/api/auth/logout', { method:'POST', headers }); } finally { localStorage.clear(); location.href='/'; } });
        loadProfile();
    </script>
</body>
</html>
