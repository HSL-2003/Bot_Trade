<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | Confluence Algo Bot</title>
<style>
:root {
  color-scheme: dark;
  --bg: #070b14;
  --panel: #101a2b;
  --line: #243b58;
  --muted: #91a6c1;
  --text: #e7f0ff;
  --accent: #38bdf8;
  --green: #4ade80;
  --red: #fb7185;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top right, #102a49 0, #070b14 45%);
  color: var(--text);
  font: 15px Inter, Arial, sans-serif;
}
main {
  width: min(1180px, calc(100% - 32px));
  margin: auto;
  padding: 32px 0 48px;
}
.top {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
}
h1, h2, p { margin: 0; }
.eyebrow, .label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.account { color: var(--muted); margin-top: 8px; }
.nav { display: flex; gap: 8px; flex-wrap: wrap; }
.button {
  color: var(--text);
  background: #14243a;
  border: 1px solid var(--line);
  padding: 10px 14px;
  border-radius: 8px;
  text-decoration: none;
  font: inherit;
  cursor: pointer;
  transition: all 0.2s ease;
}
.button:hover { background: #1c3250; }
.button.danger { color: #fecdd3; }
.cards {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin: 28px 0;
}
.card, .panel {
  background: rgba(16, 26, 43, .94);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
}
.value { font-size: 26px; font-weight: 800; margin-top: 10px; }
.panel { margin-top: 18px; }
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
#chart { width: 100%; height: 280px; display: block; }
table { width: 100%; border-collapse: collapse; }
th, td {
  text-align: left;
  padding: 12px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
.table-wrap { overflow: auto; }
.positive { color: var(--green); }
.negative { color: var(--red); }

/* Pagination */
.pagination-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  font-size: 13px;
  color: var(--muted);
  flex-wrap: wrap;
  gap: 10px;
}
.pagination-btns {
  display: flex;
  gap: 4px;
  align-items: center;
  flex-wrap: wrap;
}
.page-btn {
  background: #14243a;
  border: 1px solid var(--line);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
}
.page-btn:hover:not(:disabled):not(.active) {
  background: rgba(56, 189, 248, 0.15);
  border-color: var(--accent);
}
.page-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #090d16;
}
.page-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.page-dots {
  padding: 0 4px;
}

@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){
  main{padding-top:20px}
  .top{align-items:flex-start;flex-direction:column}
  .cards{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <div class="eyebrow">Performance overview</div>
      <h1>User Dashboard</h1>
      <p class="account" id="account">Checking session…</p>
    </div>
    <nav class="nav">
      <a class="button" href="/app?view=terminal">Terminal</a>
      <a class="button" href="/profile">Profile</a>
      <button class="button danger" id="logout">Log out</button>
    </nav>
  </header>

  <section class="cards">
    <div class="card"><div class="label">Total profit</div><div class="value" id="profit">—</div></div>
    <div class="card"><div class="label">Win rate</div><div class="value" id="winrate">—</div></div>
    <div class="card"><div class="label">Trades</div><div class="value" id="trades">—</div></div>
    <div class="card"><div class="label">Winning</div><div class="value positive" id="wins">—</div></div>
    <div class="card"><div class="label">Losing</div><div class="value negative" id="losses">—</div></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Cumulative profit</h2>
      <span class="account">Last 30 days</span>
    </div>
    <svg id="chart" viewBox="0 0 900 280" role="img" aria-label="Cumulative profit chart"></svg>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Recent closed trades</h2>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Side</th>
            <th>Profit</th>
            <th>Status</th>
            <th>Closed</th>
          </tr>
        </thead>
        <tbody id="tradeRows"></tbody>
      </table>
    </div>

    <!-- Dashboard Pagination -->
    <div class="pagination-bar" id="dashboardPagination">
      <div id="pageInfo">Showing 0 of 0 trades</div>
      <div class="pagination-btns" id="pageButtons"></div>
    </div>
  </section>
</main>

<script>
const token = localStorage.getItem('access_token');
const headers = { 'Authorization': `Bearer ${token}` };
const money = n => Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

let allDashboardTrades = [];
let currentPage = 1;
const pageSize = 15;

function escapeHtml(v) {
  const e = document.createElement('div');
  e.textContent = v ?? '';
  return e.innerHTML;
}

async function session() {
  if (!token) throw new Error('missing');
  const r = await fetch('/api/auth/me', { headers });
  if (!r.ok) throw new Error('expired');
  return r.json();
}

function renderTradesPage() {
  const total = allDashboardTrades.length;
  const tbody = document.getElementById('tradeRows');
  const info = document.getElementById('pageInfo');
  const btns = document.getElementById('pageButtons');

  if (!total) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 24px; color: var(--muted);">No closed trades yet.</td></tr>';
    info.textContent = 'Showing 0 of 0 trades';
    btns.innerHTML = '';
    return;
  }

  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  const startIdx = (currentPage - 1) * pageSize;
  const endIdx = Math.min(startIdx + pageSize, total);
  const slice = allDashboardTrades.slice(startIdx, endIdx);

  info.textContent = `Showing ${startIdx + 1} - ${endIdx} of ${total} trades (Page ${currentPage}/${totalPages})`;

  tbody.innerHTML = slice.map(t => `
    <tr>
      <td>${escapeHtml(t.symbol)}</td>
      <td>${escapeHtml(t.side)}</td>
      <td class="${Number(t.profit) < 0 ? 'negative' : 'positive'}">${money(t.profit)}</td>
      <td>${escapeHtml(t.status)}</td>
      <td>${escapeHtml(t.closed_at)}</td>
    </tr>
  `).join('');

  // Pagination buttons
  btns.innerHTML = '';
  const prev = document.createElement('button');
  prev.className = 'page-btn';
  prev.textContent = '‹ Prev';
  prev.disabled = currentPage === 1;
  prev.onclick = () => { currentPage--; renderTradesPage(); };
  btns.appendChild(prev);

  for (let p = 1; p <= totalPages; p++) {
    if (p === 1 || p === totalPages || (p >= currentPage - 2 && p <= currentPage + 2)) {
      const b = document.createElement('button');
      b.className = `page-btn ${p === currentPage ? 'active' : ''}`;
      b.textContent = p;
      b.onclick = () => { currentPage = p; renderTradesPage(); };
      btns.appendChild(b);
    } else if (p === currentPage - 3 || p === currentPage + 3) {
      const dots = document.createElement('span');
      dots.className = 'page-dots';
      dots.textContent = '…';
      btns.appendChild(dots);
    }
  }

  const next = document.createElement('button');
  next.className = 'page-btn';
  next.textContent = 'Next ›';
  next.disabled = currentPage === totalPages;
  next.onclick = () => { currentPage++; renderTradesPage(); };
  btns.appendChild(next);
}

async function load() {
  try {
    const user = await session();
    document.getElementById('account').textContent = `Account: ${user.account_id}`;
    const r = await fetch('/api/dashboard/data?days=30', { headers });
    if (!r.ok) throw new Error('expired');
    const d = await r.json();
    const s = d.summary;

    const profitEl = document.getElementById('profit');
    profitEl.textContent = money(s.total_profit);
    profitEl.className = 'value ' + (s.total_profit < 0 ? 'negative' : 'positive');

    document.getElementById('winrate').textContent = money(s.win_rate) + '%';
    document.getElementById('trades').textContent = s.total_trades;
    document.getElementById('wins').textContent = s.winning_trades;
    document.getElementById('losses').textContent = s.losing_trades;

    allDashboardTrades = d.trades || [];
    currentPage = 1;
    renderTradesPage();
    draw(d.points || []);
  } catch (e) {
    localStorage.clear();
    location.href = '/login';
  }
}

function draw(points) {
  const svg = document.getElementById('chart');
  if (!points.length) {
    svg.innerHTML = '<text x="30" y="140" fill="#91a6c1">No profit data yet</text>';
    return;
  }
  const vals = points.map(p => Number(p.cumulative_profit));
  const min = Math.min(...vals, 0);
  const max = Math.max(...vals, 1);
  const range = max - min || 1;
  const path = vals.map((v, i) => `${i ? 'L' : 'M'} ${30 + i * 840 / Math.max(vals.length - 1, 1)} ${250 - (v - min) * 210 / range}`).join(' ');
  svg.innerHTML = `
    <line x1="30" y1="250" x2="870" y2="250" stroke="#29415f"/>
    <path d="${path}" fill="none" stroke="#38bdf8" stroke-width="3"/>
  `;
}

document.getElementById('logout').onclick = async () => {
  try {
    await fetch('/api/auth/logout', { method: 'POST', headers });
  } finally {
    localStorage.clear();
    location.href = '/';
  }
};

load();
</script>
</body>
</html>
